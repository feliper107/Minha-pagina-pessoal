<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com Felipe Remédios.">
    <title>Contato | Felipe Remédios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-contato">
    <header class="cabecalho">
        <a class="marca" href="index.html">Felipe <span>R.</span></a>
        <nav class="navegacao" aria-label="Navegação principal">
            <a href="index.html">Página inicial</a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="secao secao-formulario">
            <div class="titulo-secao">
                <p class="sobretitulo">Fale comigo</p>
                <h1>Entre em contato</h1>
                <p>Preencha o formulário para enviar sua mensagem.</p>
            </div>
            <form class="formulario-contato">
                <fieldset class="formss">
                    <legend>Dados do contato</legend>
                    <div class="campo-formulario">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" autocomplete="name" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="assunto">Assunto</label>
                        <input type="text" id="assunto" name="assunto">
                    </div>
                    <div class="campo-formulario">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
                    </div>
                    <div class="acoes-formulario">
                        <button type="submit">Enviar mensagem</button>
                        <button class="botao-secundario" type="reset">Limpar</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <div class="links-rodape">
            <a href="https://www.linkedin.com/in/felipe-remedios-33370b232" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/feliper107" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
        <p>Desenvolvido por Felipe Remédios</p>
        <p>Minha página pessoal · 2026</p>
    </footer>
</body>
</html>
